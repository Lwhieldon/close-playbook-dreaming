# Facts the transcripts establish, with when they became true and what replaced them.
# scripts/audit_data.py checks every `evidence` string appears in the named transcript, and that a
# superseded fact's replacement comes from a later session.

facts:
  - id: ic-cutoff-bd3
    statement: Intercompany cutoff is BD3 at 12:00 noon ET.
    valid_from: 2026-07-15
    superseded_by: ic-cutoff-bd2
    evidence:
      - [00-controller-notes.md, "Intercompany cutoff is BD3 at 12:00 noon ET"]
  - id: ic-cutoff-bd2
    statement: Intercompany cutoff is BD2 at 5:00 pm ET, starting with the October 2026 close (agreed in the 9/29 close retro).
    valid_from: 2026-11-02
    evidence:
      - [06-sep-close-kickoff.txt, "Starting with the October close it moves to BD2 at"]
      - [12-oct-close-kickoff.txt, "IC cutoff is now BD2 at 5:00 pm ET"]

  - id: accrual-threshold-10k
    statement: Manual accrual threshold is $10,000 per vendor per month.
    valid_from: 2026-07-15
    superseded_by: accrual-threshold-25k
    evidence:
      - [00-controller-notes.md, "Manual accrual threshold is $10,000 per vendor per month"]
  - id: accrual-threshold-25k
    statement: Manual accrual threshold is $25,000 per vendor per month (policy memo FIN-POL-014, effective with the September 2026 close).
    valid_from: 2026-10-01
    evidence:
      - [06-sep-close-kickoff.txt, "FIN-POL-014"]

  - id: fx-rate-type-m
    statement: FX revaluation (FAGL_FCV) uses exchange rate type M.
    valid_from: 2026-07-22
    superseded_by: fx-rate-type-zcls
    evidence:
      - [00-controller-notes.md, "exchange rate type M"]
  - id: fx-rate-type-zcls
    statement: FX revaluation uses rate type ZCLS (treasury closing spot, 4:00 pm London, last calendar day), per treasury memo TRS-2026-07, from the October 2026 close.
    valid_from: 2026-11-02
    evidence:
      - [12-oct-close-kickoff.txt, "TRS-2026-07"]

  - id: r4410-std-840
    statement: Standard price of R-4410 stainless bar 316 is $8.40/kg (January 2026 costing run).
    valid_from: 2026-01-01
    superseded_by: r4410-std-915
    evidence:
      - [10-sep-toledo-ppv.txt, "against a standard of $8.40/kg"]
  - id: r4410-std-915
    statement: Standard price of R-4410 is $9.15/kg after the Q4 costing run Z26Q4 released 2026-10-01.
    valid_from: 2026-10-01
    evidence:
      - [13-oct-toledo-ppv-grir.txt, "R-4410's standard is $9.15/kg"]

  - id: plants-1000-two
    statement: Plants in scope for company code 1000 are 1100 Toledo and 1200 Dayton.
    valid_from: 2026-07-15
    superseded_by: plants-1000-three
    evidence:
      - [01-aug-close-kickoff.txt, "Plants in scope for 1000: 1100 Toledo and 1200 Dayton"]
  - id: plants-1000-three
    statement: Plants in scope for 1000 are 1100 Toledo, 1200 Dayton and 1300 Greenville (live 2026-10-01, in close scope from October).
    valid_from: 2026-11-02
    evidence:
      - [12-oct-close-kickoff.txt, "1100 Toledo, 1200 Dayton, 1300 Greenville"]

  - id: allied-uom
    statement: Allied Fastener Supply (vendor 300457) invoices in BX (100 EA); missing info record conversion caused GR/IR quantity differences F.13 cannot clear. Purchasing added 1 BX = 100 EA on 2026-10-14; older items need MR11 with controller approval.
    valid_from: 2026-10-01
    evidence:
      - [07-sep-toledo-grir-allied.txt, "has no\nBX to EA conversion"]
      - [13-oct-toledo-ppv-grir.txt, "Changed 10/14/2026 by K. Alvarez"]

  - id: mx-ic-posting-date
    statement: Tarnwell de Mexico (3000) posted IC invoices to 1000 in the next period two months running; agreed fix is posting date = last day of the closing month while 3000's period is open. Worked in October.
    valid_from: 2026-10-02
    evidence:
      - [08-sep-ic-1000-3000.txt, "posting date = last calendar day of the month being"]
      - [14-oct-ic-bd2-cutoff.txt, "the posting-date change agreed in September worked"]

  - id: order-job-sequence
    statement: Period-end production order jobs must run KKAO (WIP), then KKS2 (variance), then CO88 (settlement).
    valid_from: 2026-09-02
    evidence:
      - [04-aug-dayton-order-variances.txt, "WIP (KKAO), then variance calculation (KKS2), then settlement (CO88)"]

