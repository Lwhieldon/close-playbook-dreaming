    expected: 3000 posted IC invoices to 1000 on the date they arrived in the shared mailbox, so invoices arriving after month end landed in the next period (August and September closes). Fix agreed by Priya Nair and Marco Reyes on 2026-10-02 - posting date = last day of the month being closed while 3000's period is open. It worked in the October close.
    key_points:
      - "3000 posted IC invoices on the date they arrived in the shared mailbox"
      - "Invoices arriving after month end landed in the next period (August and September closes)"
      - "Fix: posting date = last day of the month being closed while 3000's period is open"
      - "Agreed by Priya Nair and Marco Reyes on 2026-10-02"
      - "It worked in the October close"
    points_needed: 4
    must_include: ["posting date"]
    evidence: [[sep-ic-sync, "set the posting date to the last day of the month you're closing"]]

