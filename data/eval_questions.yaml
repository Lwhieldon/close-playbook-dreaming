    expected: That ZCLS rates exist for the exact key date (last calendar day). When month end falls on a weekend, treasury's last load may be dated Friday and the run fails (as on 10/31/2026). The next weekend month end is January 31, 2027 (a Sunday).
    key_points:
      - "ZCLS rates must exist for the exact key date (the last calendar day)"
      - "On a weekend month end, treasury's last load may be dated Friday, so the run fails"
      - "This happened on 10/31/2026"
      - "The next weekend month end is January 31, 2027 (a Sunday)"
    must_include: ["weekend"]
    evidence: [[oct-review, "The next weekend month end is January 31st, a Sunday."]]

