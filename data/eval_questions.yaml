    expected: WIP (KKAO), then variance calculation (KKS2), then settlement (CO88). In August the new scheduled job at Dayton ran CO88 first, so nothing settled; Sam reversed and reran it, and an IT ticket was opened to chain the steps.
    key_points:
      - "Order: WIP (KKAO), then variance (KKS2), then settlement (CO88)"
      - "In August, Dayton's new scheduled job ran settlement (CO88) first, so nothing settled"
      - "Sam reversed and reran it, and an IT ticket was opened to chain the steps"
    must_include: ["KKS2", "CO88"]
    evidence: [[aug-standup-grir-dayton, "the new scheduled job ran settlement first"]]

