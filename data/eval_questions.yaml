# Questions a close team would ask at the start of the November 2026 close (after the October close).
# Expected answers reflect the latest facts. `must_include` are case-insensitive strings a correct answer
# contains (checked deterministically). The judge marks each of `key_points` met, partial or missed; the
# score is the share met (partial counts half), out of `points_needed` when set (default: all of them),
# capped at 1. Saying anything in `avoid` scores 0; each `deductions` item hit takes off 0.25. `expected`
# is the full answer the judge reads for context.
# `evidence` is [manifest key, text] so scripts/audit_data.py can confirm each answer is in the corpus.
# Types: stale_fact, history, buried_detail, evidence, recurring_trap, process, synthesis, integrity.

questions:
  - id: q01
    type: stale_fact
    question: What is the intercompany cutoff for the month-end close?
    expected: BD2 at 5:00 pm ET, from the October 2026 close (IC cutoff change notice, 2026-09-30); documents must be posted, not parked. Before that BD3 at noon ET (July to September), and BD4 at noon ET before July.
    key_points:
      - "The current cutoff is BD2 at 5:00 pm ET"
      - "It applies from the October 2026 close"
      - "Documents must be posted, not parked, by the cutoff"
    must_include: ["BD2"]
    evidence: [[memo-ic-cutoff-2026-09, "the intercompany cutoff is BD2 at 5:00 pm Eastern Time"]]

