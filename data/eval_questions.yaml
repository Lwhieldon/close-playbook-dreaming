    question: Why didn't Allied Fastener Supply's GR/IR items clear, and is the problem resolved?
    expected: Allied invoices in boxes of 100 (BX) but the info records had no BX to EA conversion, so invoice quantities came in at 1/100 and F.13 could not clear them. Kim Alvarez added 1 BX = 100 EA to all three info records (5300014420, 5300014421, 5300014422) on 2026-10-14, and the six remaining items were cleared with MR11 5000034412 on 2026-11-05. Resolved.
    key_points:
      - "Cause: Allied invoices in boxes (BX) and the info records had no BX to EA conversion"
      - "Effect: invoice quantities came in at 1/100, so F.13 could not clear the items"
      - "Fix: 1 BX = 100 EA set on all three info records on 2026-10-14 (Kim Alvarez)"
      - "The remaining items were cleared with MR11 5000034412 on 2026-11-05"
      - "States that the problem is resolved"
    deductions:
      - "Says items are still open or the fix is unverified for some materials"
    must_include: ["BX"]
    evidence: [[change-log-2026-10, "5300014421 (300457 / F-2210)"], [je-register-2026-10, "MR11 Allied 300457 6 items"]]

  - id: q13
