[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "close-dreamer"
version = "0.1.0"
description = "Dreaming for a month-end close assistant: distill close-session transcripts into a dated, linked close playbook."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0.0,<3",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
notebooks = ["jupyter", "ipykernel", "matplotlib"]

[project.scripts]
close-dreamer = "close_dreamer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
close_dreamer = ["prompts/*.md", "vendor/prompts/*.md"]

[tool.ruff]
extend-exclude = ["src/close_dreamer/vendor", "notebooks"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# SAP-style report rows are data at their natural width.
"scripts/build_transcripts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
